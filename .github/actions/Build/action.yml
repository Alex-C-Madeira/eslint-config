name: "Build"
description: "Install dependencies and Build project"
inputs:
  npmToken:
    description: "token from npm publish account"
    default: ""
  npmScope:
    description: "Scope of npm project"
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      id: pnpm-setup
      with:
        version: 10

    - name: Use Node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      id: install-dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile

    - name: Typecheck
      id: typecheck
      shell: bash
      run: pnpm run typecheck

    - name: Lint
      id: lint
      shell: bash
      run: pnpm run lint

    - name: Check package
      id: pack-check
      shell: bash
      run: pnpm run pack:check
